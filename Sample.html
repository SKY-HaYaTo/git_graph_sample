
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>はじめてのHTML</title>
  <style>
    body {
      font-family: sans-serif;
      background-color: #f0f4f8;
      text-align: center;
      padding: 50px;
    }

    .container {
      background: white;
      padding: 30px;
      border-radius: 12px;
      max-width: 500px;
      margin: auto;
    }

    button {
      background: #007bff;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>こんにちは！</h1>
    <p>これは簡単なHTMLサンプルです。</p>
    <button onclick="alert('おはよう！')">
      おはよう
    </button>
    <button onclick="alert('こんにちは！')">
      こんにちは
    </button>
    <button onclick="alert('こんばんは！')">
      こんばんは
    </button>
  </div>

</body>
</html>
